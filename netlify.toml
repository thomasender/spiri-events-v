[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "https://thetribe.at/*"
  to = "https://events.thetribe.at/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.thetribe.at/*"
  to = "https://events.thetribe.at/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"