name: Build and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [firestore-build]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: hosting-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Restore Firebase Admin service account
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > scripts/service-account.json
          chmod 600 scripts/service-account.json

      - name: Decode service account JSON for deploy action
        id: sa
        run: |
          {
            echo 'json<<EOF'
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}' | base64 -d
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build (Vite + prerender)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: scripts/service-account.json
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.sa.outputs.json }}
          channelId: live
          projectId: spirieventsvbg
