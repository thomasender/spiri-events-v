# Dependabot version updates (weekly, grouped). The "ignore" rules below only
# hold back semver-major version updates; those are done by hand. Security
# alerts are handled separately by Dependabot security updates.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      # Move together to avoid mismatched versions.
      firebase:
        patterns:
          - 'firebase'
          - '@firebase/*'
      tiptap:
        patterns:
          - '@tiptap/*'
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major bumps are done by hand.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'happy-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/functions'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      firebase:
        patterns:
          - 'firebase'
          - 'firebase-*'
          - '@firebase/*'
      functions-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
