# Dependabot version updates (weekly, grouped). The "ignore" rules below only
# hold back semver-major version updates; those are done by hand. Security
# alerts are handled separately by Dependabot security updates.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      # Move together to avoid mismatched versions.
      firebase:
        patterns:
          - 'firebase'
          - '@firebase/*'
      tiptap:
        patterns:
          - '@tiptap/*'
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major bumps are done by hand.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'happy-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']
      # Build/test/dev tooling majors: lifted together with a Vite upgrade, not one by one
      # (see the Trello ticket "Tooling-Majors gebündelt anheben").
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite-plugin-pwa'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      # @playwright/experimental-ct-react (latest 1.62.x) needs the same playwright version as
      # @playwright/test; a newer test/playwright pair loads two copies and no spec is found.
      # Lift the three together once ct-react ships a matching release.
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'playwright'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: '/functions'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      firebase:
        patterns:
          - 'firebase'
          - 'firebase-*'
          - '@firebase/*'
      functions-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # satori >0.35 drops the footer line ("N Events - weiter wischen") on the Instagram cover.
      # Stays on 0.35.x until that is fixed/verified; 0.x minors are breaking, so block them too.
      - dependency-name: 'satori'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies']
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Runtime majors of the workflow building blocks: lifted by hand together with a PR CI.
      - dependency-name: 'actions/checkout'
        update-types: ['version-update:semver-major']
      - dependency-name: 'actions/setup-node'
        update-types: ['version-update:semver-major']
